stages:
  - test

unit_tests:
  stage: test
  tags:
    - linux-docker
  image: ghcr.io/cirruslabs/android-sdk:36
  variables:
    # Gradle : cache local au projet et options mémoire raisonnables
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
  before_script:
    - cp "$GOOGLE_SERVICES_JSON" app/google-services.json
    - chmod +x ./gradlew
    - java -version
  script:
    - ./gradlew test --no-daemon --stacktrace
  artifacts:
    when: always
    paths:
      - "**/build/reports/tests/"
    expire_in: 1 week
    reports:
      junit:
        - "**/build/test-results/test*/TEST-*.xml"
  cache:
    key: gradle-${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/
      - .gradle/caches/
      - .gradle/wrapper/

# Scan de secrets (clés API, tokens...) accidentellement commités.
# Tourne à chaque push sur main.
# gitleaks lit l'historique git lui-même : GIT_DEPTH à 0 pour que le clone
# GitLab CI ne soit pas tronqué et que tout l'historique soit bien scanné.
secret_scan:
  stage: test
  tags:
    - linux-docker
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks detect --source . --no-banner --redact --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week

# Scan des dépendances Gradle pour des CVE connues (OWASP Dependency-Check).
# Hebdomadaire uniquement.
#
# Prérequis :
#   - Une variable CI/CD masquée NVD_API_KEY (clé gratuite sur nvd.nist.gov)
dependency_scan:
  stage: test
  tags:
    - linux-docker
  image: ghcr.io/cirruslabs/android-sdk:36
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  timeout: 2h
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
  before_script:
    - cp "$GOOGLE_SERVICES_JSON" app/google-services.json
    - chmod +x ./gradlew
  script:
    - ./gradlew dependencyCheckAnalyze --no-daemon --stacktrace --no-configuration-cache
  artifacts:
    when: always
    paths:
      # Le plugin écrit dans reports/dependency-check/, pas directement dans reports/.
      - "**/build/reports/dependency-check/dependency-check-report.html"
    expire_in: 1 week
  # Deux caches distincts, et surtout des clés différentes de celle de unit_tests :
  # avec une clé commune, le job qui se termine en dernier écrase le cache de l'autre
  # avec ses propres chemins, et la base NVD était retéléchargée à chaque exécution.
  cache:
    - key: gradle-dependency-scan-${CI_COMMIT_REF_SLUG}
      paths:
        - .gradle/caches/
        - .gradle/wrapper/
    # La base NVD ne dépend ni de la branche ni du code : clé stable.
    # Chemin par défaut du plugin : <GRADLE_USER_HOME>/dependency-check-data, et
    # GRADLE_USER_HOME est défini plus haut sur $CI_PROJECT_DIR/.gradle.
    - key: nvd-data
      paths:
        - .gradle/dependency-check-data/
