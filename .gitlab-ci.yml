# =============================================================================
# CI Cartouche — les jobs proviennent du socle partage Cklla/ci-templates.
#
# Ce fichier ne contient QUE ce qui est propre a Cartouche : le stage et la
# reference au socle. Toute correction apportee aux jobs eux-memes se fait
# dans ci-templates puis se recupere ici en changeant `ref`.
#
# Aucune variable CI n'est requise : les valeurs Supabase, RAWG et IGDB vivent
# dans local.properties et restent vides en CI (build non signe, tests seuls).
# =============================================================================

include:
  - project: 'Cklla/ci-templates'
    ref: 'v1.2.1'
    file:
      # unit_tests
      - '/templates/gradle-tests.gitlab-ci.yml'
      # secret_scan
      - '/templates/secret-scan.gitlab-ci.yml'
      # dependency_inventory + dependency_scan
      - '/templates/gradle-security.gitlab-ci.yml'

stages:
  - test
